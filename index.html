/* ================= STORAGE HELPERS ================= */
const $=s=>document.querySelector(s), root=$('#root');

/* ================= CONTENT: LEARNING TOPICS ================= */
const TOPICS=[
{id:'var',t:'Variables',i:'box',d:'A variable is a name that stores a value.<pre>name = "Asha"\nage = 20\nprint(name, age)</pre>',p:['Create variables with =','Follow naming rules (letters, digits, _)','Reassign a variable']},
{id:'dt',t:'Data Types',i:'123',d:'Common types: int, float, str, bool. Use type() to check.<pre>print(type(3.14))  # float\nprint(type("hi"))  # str</pre>',p:['Know int, float, str, bool','Convert with int(), str()','Use type()']},
{id:'op',t:'Operators',i:'calculator',d:'Arithmetic: + - * / // % **. Comparison: == != &lt; &gt;. Logic: and, or, not.<pre>print(7 // 2, 7 % 3, 2 ** 3)</pre>',p:['Use arithmetic operators','Compare values','Combine with and/or/not']},
{id:'cond',t:'Conditions',i:'signpost-split',d:'Use if / elif / else to choose a path.<pre>n = 5\nif n % 2 == 0:\n    print("Even")\nelse:\n    print("Odd")</pre>',p:['Write if/else','Chain with elif','Respect indentation']},
{id:'loop',t:'Loops',i:'arrow-repeat',d:'for loops iterate; while loops repeat while a condition is true.<pre>for i in range(3):\n    print(i)</pre>',p:['Use for with range()','Use while','Use break / continue']},
{id:'fn',t:'Functions',i:'gear',d:'Functions package reusable code.<pre>def add(a, b=0):\n    return a + b\nprint(add(2, 3))</pre>',p:['Define with def','Use parameters and return','Use default values']},
{id:'col',t:'Collections',i:'collection',d:'list [ ] (mutable), tuple ( ) (fixed), set { } (unique), dict {k: v}.<pre>nums = [1, 2, 3]\nnums.append(4)\nd = {"a": 1}</pre>',p:['Use lists','Know tuple vs set','Use dictionaries']},
{id:'adv',t:'Advanced Challenges',i:'trophy',d:'Harder problems that combine everything you learned. <b>Unlocks after you complete the first 7 topics.</b> Complete all challenges to finish this topic.',p:['Finish topics 1-7','Solve every advanced challenge']}];
const CORE=TOPICS.filter(t=>t.id!=='adv');

/* ================= CONTENT: QUIZZES (q = text, options "|"-separated, correct index, explanation) ================= */
const q=(t,o,a,e)=>({t,o:o.split('|'),a,e});
const QZ={

q('Which function displays output?','print|echo|show|write',0,'print() sends output to the screen.'),
q('Which symbol starts a comment?','//|#|/*|--',1,'Python comments start with #.'),
q('Which is a valid variable name?','1name|my-var|my_var|class',2,'Names cannot start with digits, contain "-", or be keywords.'),
q('Python is...','compiled only|an interpreted high-level language|assembly|a markup language',1,'Python code is executed by an interpreter.'),
q('Python files use which extension?','.pt|.pyt|.py|.python',2,'The extension is .py.'),
q('What does print(2+3) show?','23|"2+3"|Error|5',3,'2+3 is evaluated to 5.'),
q('Python blocks are defined by...','braces|indentation|semicolons|parentheses',1,'Indentation defines blocks.'),
q('Which function reads user input?','input()|read()|scan()|get()',0,'input() reads a line as a string.'),
q('After x=5; x=x+2, x is...','5|2|7|52',2,'x is reassigned to 5+2 = 7.'),
q('Are Name and name the same variable?','Yes|No|Only in functions|Only in classes',1,'Python is case-sensitive.')],
'Data Types':[
q('type(3.14) is...','int|float|str|double',1,'Decimals are float.'),
q('type("hi") is...','int|list|str|bool',2,'Text is str.'),
q('Which is mutable?','tuple|str|list|int',2,'Lists can be changed in place.'),
q('bool(0) is...','True|False|0|Error',1,'0 is falsy.'),
q('int("42") + 1 equals...','43|"421"|Error|42',0,'"42" becomes 42, plus 1 = 43.'),
q('len("Python") is...','5|7|Error|6',3,'Python has 6 letters.'),
q('Which creates a dict?','[1,2]|{1,2}|{"a":1}|(1,2)',2,'{key: value} makes a dictionary.'),
q('type((1,2)) is...','list|tuple|set|dict',1,'Parentheses with commas make a tuple.'),
q('"5" + "3" gives...','8|53|Error|"5 3"',1,'Strings are concatenated: "53".'),
q('Which is NOT a built-in type?','int|str|char|bool',2,'Python has no char type; use str.')],
'Operators':[
q('7 // 2 equals...','3.5|3|4|2',1,'// is floor division.'),
q('2 ** 3 equals...','6|9|5|8',3,'** is power: 2*2*2 = 8.'),
q('7 % 3 equals...','1|2|0|3',0,'Remainder of 7/3 is 1.'),
q('5 == 5.0 is...','True|False|Error|None',0,'Values are equal.'),
q('not True is...','True|False|None|Error',1,'not flips the boolean.'),
q('Which operator tests membership?','in|has|is|contains',0,'Use "in".'),
q('10 / 4 equals...','2|2.5|2.0|3',1,'/ always gives a float.'),
q('After x=5; x+=3, x is...','5|3|8|15',2,'x += 3 means x = x + 3.'),
q('True and False is...','True|False|None|1',1,'and needs both True.'),
q('Which operator checks identity?','==|is|=|!=',1,'"is" compares object identity.')],
'Conditions & Loops':[
q('Keyword for "else if"?','elif|elseif|else if|elsif',0,'Python uses elif.'),
q('range(3) yields...','1,2,3|0,1,2|0,1,2,3|1,2',1,'It starts at 0 and stops before 3.'),
q('Which exits a loop?','stop|exit|break|end',2,'break leaves the loop.'),
q('Which skips to the next iteration?','skip|continue|pass|next',1,'continue skips the rest of the body.'),
q('Last value printed by: for i in range(1,4): print(i)','4|3|1|0',1,'range(1,4) is 1,2,3.'),
q('A while loop runs while its condition is...','True|False|never|once',0,'It repeats as long as the condition is True.'),
q('s=0; for i in range(4): s+=i. What is s?','6|10|4|3',0,'0+1+2+3 = 6.'),
q('Which is a do-nothing placeholder?','pass|null|none|void',0,'pass does nothing.'),
q('if 0: ... treats 0 as...','True|False|Error|None',1,'0 is falsy.'),
q('len(list(range(5,10))) is...','4|5|6|10',1,'5,6,7,8,9 = 5 items.')],
'Functions':[
q('Keyword to define a function?','func|def|function|lambda',1,'Use def.'),
q('Keyword to send a value back?','give|return|out|yield only',1,'return sends back a value.'),
q('def f(a,b=2): return a+b. f(1) is...','3|1|Error|2',0,'b defaults to 2, so 1+2 = 3.'),

q('Recursion means...','a function calling itself|a loop|a class|a module',0,'A recursive function calls itself.')]};
const QN=Object.keys(QZ);

/* ================= CONTENT: CODING EXERCISES (tests: c = code appended, e = expected stdout) ================= */
const EX=[
{id:'e1',t:'Hello Python',d:'Print exactly: Hello, Python!',s:'# Print the greeting\n',T:[{c:'',e:'Hello, Python!'}]},
{id:'e2',t:'Even or Odd',d:'Write check(n) that RETURNS "Even" or "Odd". (Do not print outside the function.)',s:'def check(n):\n    pass\n',T:[{c:'print(check(4))',e:'Even'},{c:'print(check(7))',e:'Odd'},{c:'print(check(0))',e:'Even'}]},
{id:'e3',t:'Sum of List',d:'Write total(lst) that returns the sum of a list (do not use sum()).',s:'def total(lst):\n    pass\n',T:[{c:'print(total([1,2,3]))',e:'6'},{c:'print(total([]))',e:'0'},{c:'print(total([-1,5]))',e:'4'}]},
{id:'e4',t:'Reverse String',d:'Write rev(s) that returns the reversed string.',s:'def rev(s):\n    pass\n',T:[{c:'print(rev("python"))',e:'nohtyp'},{c:'print(rev(""))',e:''},{c:'print(rev("ab"))',e:'ba'}]},
{id:'e5',t:'Largest Number',d:'Write largest(lst) that returns the biggest number (do not use max()).',s:'def largest(lst):\n    pass\n',T:[{c:'print(largest([3,9,2]))',e:'9'},{c:'print(largest([-5,-2,-8]))',e:'-2'}]},
{id:'a1',adv:1,t:'Factorial',d:'Write factorial(n). factorial(0) is 1.',s:'def factorial(n):\n    pass\n',T:[{c:'print(factorial(5))',e:'120'},{c:'print(factorial(0))',e:'1'},{c:'print(factorial(7))',e:'5040'}]},
{id:'a2',adv:1,t:'Palindrome',d:'Write is_palindrome(s) returning True/False, ignoring upper/lower case.',s:'def is_palindrome(s):\n    pass\n',T:[{c:'print(is_palindrome("Level"))',e:'True'},{c:'print(is_palindrome("Python"))',e:'False'},{c:'print(is_palindrome("Racecar"))',e:'True'}]},
{id:'a3',adv:1,t:'FizzBuzz',d:'Write fizzbuzz(n): "FizzBuzz" if divisible by 3 and 5, "Fizz" if by 3, "Buzz" if by 5, else the number as a string.',s:'def fizzbuzz(n):\n    pass\n',T:[{c:'print(fizzbuzz(15))',e:'FizzBuzz'},{c:'print(fizzbuzz(9))',e:'Fizz'},{c:'print(fizzbuzz(10))',e:'Buzz'},{c:'print(fizzbuzz(7))',e:'7'}]},
{id:'a4',adv:1,t:'Count Vowels',d:'Write count_vowels(s) counting a,e,i,o,u (any case).',s:'def count_vowels(s):\n    pass\n',T:[{c:'print(count_vowels("Python Exam"))',e:'3'},{c:'print(count_vowels("rhythm"))',e:'0'}]}];

/* ================= AUTH ================= */
function authView(){root.innerHTML=`<div class="auth-wrap"><div class="card auth-card p-4">
<div class="text-center mb-3"><i class="bi bi-braces-asterisk display-4 text-primary"></i><h2 class="fw-bold">Python Exam</h2><p class="text-muted mb-0">Learn · Practice · Get tested</p></div>
<ul class="nav nav-pills nav-fill mb-3"><li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#lg">Login</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#rg">Register</button></li></ul>
<div id="msg"></div><div class="tab-content">
<div class="tab-pane fade show active" id="lg"><input id="li" class="form-control mb-2" placeholder="Student ID (or admin)"><input id="lp" type="password" class="form-control mb-3" placeholder="Password"><button class="btn btn-primary w-100" onclick="doLogin()">Login</button></div>
<div class="tab-pane fade" id="rg"><input id="ri" class="form-control mb-2" placeholder="Student ID"><input id="rn" class="form-control mb-2" placeholder="Full name"><input id="rp" type="password" class="form-control mb-3" placeholder="Password (min 4)"><button class="btn btn-success w-100" onclick="doReg()">Create account</button></div>
</div></div></div>`}
const msg=(t,c='danger')=>$('#msg').innerHTML=`<div class="alert alert-${c} py-2">${esc(t)}</div>`;
async function doLogin(){
 const id=$('#li').value.trim(),pw=$('#lp').value;
 if(id.toLowerCase()==='admin'){                       // ----- single admin via Firebase -----
  if(pw!=='admin123')return msg('Invalid admin credentials');
  let via='firebase';
  if(FB){try{await FB.signInWithEmailAndPassword(ADMIN_EMAIL,pw)}
   catch(e){try{await FB.createUserWithEmailAndPassword(ADMIN_EMAIL,pw)}catch(e2){via='local'}}}
  else via='local';
  return start({role:'admin',id:'admin',name:'Administrator',via});
 }
 const u=ld('pe_users',{})[id];                        // ----- students (localStorage) -----
 if(!u||u.pw!==enc(pw))return msg('Invalid ID or password');
 start({role:'student',id,name:u.name});
}
function doReg(){
 const id=$('#ri').value.trim(),n=$('#rn').value.trim(),pw=$('#rp').value,us=ld('pe_users',{});
 if(!id||!n||pw.length<4)return msg('Fill all fields (password min 4 chars)');
 if(id.toLowerCase()==='admin'||us[id])return msg('That ID is not available');
 us[id]={id,name:n,pw:enc(pw)};sv('pe_users',us);start({role:'student',id,name:n});
}
function start(s){me=s;sv('pe_session',s);shell();go('dash')}
function logout(){clearInterval(tm);if(FB)FB.signOut().catch(()=>{});localStorage.removeItem('pe_session');me=null;authView()}

/* ================= SHELL / ROUTER ================= */
function shell(){
 const st=me.role==='student';
 const items=st?[['dash','speedometer2','Dashboard'],['learn','book','Learn'],['quiz','patch-question','Quizzes'],['practice','code-slash','Practice'],['adv','trophy','Advanced']]:[['dash','people','Admin Dashboard']];
 root.innerHTML=`<nav class="navbar navbar-expand-lg navbar-dark app-nav sticky-top"><div class="container">
<span class="navbar-brand fw-bold"><i class="bi bi-braces-asterisk"></i> Python Exam</span>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nv"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="nv"><ul class="navbar-nav me-auto">${items.map(([k,i,l])=>`<li class="nav-item"><a class="nav-link text-white" href="#" data-v="${k}" data-bs-toggle="collapse" data-bs-target="#nv.show" onclick="go('${k}');return false"><i class="bi bi-${i}"></i> ${l}</a></li>`).join('')}</ul>
<span class="text-white-50 me-3 small">${esc(me.name)} <span class="badge bg-light text-dark">${me.role}</span></span>
<button class="btn btn-outline-light btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button></div></div></nav>
<main class="container py-4" id="main"></main>`}
const main=h=>$('#main').innerHTML=h;
function go(v){clearInterval(tm);document.querySelectorAll('[data-v]').forEach(a=>a.classList.toggle('active',a.dataset.v===v));V[v]();scrollTo(0,0)}
const bar=(p,c='primary')=>`<div class="progress" style="height:10px"><div class="progress-bar bg-${c}" style="width:${p}%"></div></div>`;
const points=id=>{const p=gp(id);return CORE.filter(t=>p.topics[t.id]).length*10+EX.filter(e=>p.code[e.id]).length*20+new Set(myAtt(id).filter(a=>a.pass).map(a=>a.topic)).size*30};
const advOpen=()=>CORE.every(t=>gp().topics[t.id]);

const V={};
/* ---------- Dashboards ---------- */
V.dash=()=>me.role==='admin'?adminDash():studentDash();
function studentDash(){
 const p=gp(),at=myAtt(),td=CORE.length+(p.topics.adv?1:0),cd=EX.filter(e=>p.code[e.id]).length,pq=new Set(at.filter(a=>a.pass).map(a=>a.topic)).size;
 const overall=Math.round((td/8+cd/EX.length+pq/5)/3*100);
 const st=(i,c,v,l)=>`<div class="col-6 col-lg-3"><div class="card hov stat p-3 h-100"><i class="bi bi-${i} text-${c}"></i><div class="fs-3 fw-bold">${v}</div><div class="text-muted small">${l}</div></div></div>`;
 main(`<div class="card p-4 mb-4 text-white" style="background:linear-gradient(120deg,#4338ca,#ec4899)"><h3 class="mb-1">Welcome, ${esc(me.name)}! 👋</h3><div>Keep going — you are ${overall}% through the course.</div><div class="mt-3">${bar(overall,'warning')}</div></div>
<div class="row g-3 mb-4">${st('book','primary',td+'/8','Topics completed')}${st('patch-check','success',pq+'/5','Quizzes passed')}${st('code-slash','info',cd+'/'+EX.length,'Coding exercises')}${st('star-fill','warning',points(me.id),'Learning points')}</div>
<div class="row g-3"><div class="col-lg-5"><div class="card p-3 h-100"><h5>Completed topics</h5>${TOPICS.filter(t=>p.topics[t.id]).map(t=>`<span class="badge bg-success me-1 mb-1"><i class="bi bi-${t.i}"></i> ${t.t}</span>`).join('')||'<span class="text-muted">None yet — open Learn to start.</span>'}
<h6 class="mt-3">Coding practice</h6>${bar(cd/EX.length*100,'info')}</div></div>
<div class="col-lg-7"><div class="card p-3 h-100"><h5>Your quiz results</h5>${attTable(at,false)}</div></div></div>`)}
function attTable(a,admin){
 if(!a.length)return '<span class="text-muted">No quiz attempts yet.</span>';
 return `<div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>Date</th>${admin?'<th>Student</th>':''}<th>Exam</th><th>Score</th><th>%</th><th>Result</th></tr></thead><tbody>${[...a].reverse().map(x=>`<tr><td>${esc(x.date)}</td>${admin?`<td>${esc(x.name)} <small class="text-muted">(${esc(x.sid)})</small></td>`:''}<td>${esc(x.topic)}</td><td>${x.score}/${x.total}</td><td>${x.pct}%</td><td><span class="badge bg-${x.pass?'success':'danger'}">${x.pass?'Pass':'Fail'}</span></td></tr>`).join('')}</tbody></table></div>`}
function adminDash(){
 const us=Object.values(ld('pe_users',{})),at=atts(),pr=ld('pe_prog',{});
 main(`<h3 class="mb-3"><i class="bi bi-shield-check text-primary"></i> Admin Dashboard</h3>
<div class="alert alert-${me.via==='firebase'?'success':'warning'} py-2 small">Admin session: ${me.via==='firebase'?'authenticated with Firebase Auth':'local fallback (Firebase unreachable or Email/Password sign-in not enabled)'}</div>
<div class="row g-3 mb-4"><div class="col-6 col-lg-3"><div class="card p-3 stat"><i class="bi bi-people text-primary"></i><div class="fs-3 fw-bold">${us.length}</div>Students</div></div><div class="col-6 col-lg-3"><div class="card p-3 stat"><i class="bi bi-journal-check text-success"></i><div class="fs-3 fw-bold">${at.length}</div>Quiz attempts</div></div><div class="col-6 col-lg-3"><div class="card p-3 stat"><i class="bi bi-trophy text-warning"></i><div class="fs-3 fw-bold">${at.filter(a=>a.pass).length}</div>Passes</div></div><div class="col-6 col-lg-3"><div class="card p-3 stat"><i class="bi bi-x-circle text-danger"></i><div class="fs-3 fw-bold">${at.filter(a=>!a.pass).length}</div>Fails</div></div></div>
<div class="card p-3 mb-4"><h5>Registered students &amp; coding progress</h5><div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>ID</th><th>Name</th><th>Topics</th><th>Quizzes</th><th>Coding completed</th><th>Points</th></tr></thead><tbody>${us.map(u=>{const p=pr[u.id]||{topics:{},code:{}};const done=EX.filter(e=>p.code[e.id]);return `<tr><td>${esc(u.id)}</td><td>${esc(u.name)}</td><td>${TOPICS.filter(t=>p.topics[t.id]).length}/8</td><td>${myAtt(u.id).length}</td><td>${done.length}/${EX.length} ${done.map(e=>`<span class="badge bg-info text-dark">${e.t}</span>`).join(' ')}</td><td>${points(u.id)}</td></tr>`}).join('')||'<tr><td colspan=6 class="text-muted">No students yet.</td></tr>'}</tbody></table></div></div>
<div class="card p-3"><h5>All quiz attempts</h5>${attTable(at,true)}</div>`)}

/* ---------- Learn ---------- */
V.learn=()=>{
 const p=gp(),n=TOPICS.filter(t=>p.topics[t.id]).length,open=advOpen();
 main(`<h3>Learn Python</h3><p class="text-muted">${n}/8 topics completed</p>${bar(n/8*100,'success')}
<div class="accordion mt-3" id="acc">${TOPICS.map((t,k)=>{const lock=t.id==='adv'&&!open,done=p.topics[t.id];return `<div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button ${k?'collapsed':''}" data-bs-toggle="collapse" data-bs-target="#t${k}"><i class="bi bi-${lock?'lock':t.i} me-2"></i>${k+1}. ${t.t}${done?' <span class="badge bg-success ms-2">Done</span>':''}${lock?' <span class="badge bg-secondary ms-2">Locked</span>':''}</button></h2>
<div id="t${k}" class="accordion-collapse collapse ${k?'':'show'}" data-bs-parent="#acc"><div class="accordion-body"><p>${t.d}</p><h6>Learning targets</h6><ul>${t.p.map(x=>`<li>${x}</li>`).join('')}</ul>
${t.id==='adv'?`<button class="btn btn-primary" ${lock?'disabled':''} onclick="go('adv')">${lock?'Complete topics 1-7 to unlock':'Open challenges'}</button>`:`<button class="btn btn-${done?'outline-secondary':'success'}" onclick="toggleTopic('${t.id}')"><i class="bi bi-check2-circle"></i> ${done?'Mark incomplete':'Complete'}</button>`}</div></div></div>`}).join('')}</div>`)}
function toggleTopic(id){const p=gp();p.topics[id]=!p.topics[id];sp(p);V.learn()}

/* ---------- Quizzes ---------- */
V.quiz=()=>main(`<h3>Topic Quizzes</h3><p class="text-muted">10 questions · 5 minutes · 60% to pass</p><div class="row g-3">${QN.map((n,i)=>{const a=myAtt().filter(x=>x.topic===n),best=a.length?Math.max(...a.map(x=>x.pct)):null;return `<div class="col-md-6 col-lg-4"><div class="card hov p-3 h-100"><h5><i class="bi bi-patch-question text-primary"></i> ${n}</h5><div class="text-muted small mb-2">Attempts: ${a.length} · Best: ${best===null?'—':best+'%'}</div><button class="btn btn-primary mt-auto" onclick="startQuiz(${i})">Start quiz</button></div></div>`}).join('')}</div>`);
function startQuiz(i){
 // Answers are stored by option index and compared to q.a (the correct index) — no reordering, so no index mismatch.
 Q={topic:QN[i],qs:QZ[QN[i]],i:0,a:Array(10).fill(null),end:Date.now()+300000,done:false};
 clearInterval(tm);tm=setInterval(tick,500);qRender();tick()}
function tick(){const l=Math.max(0,Q.end-Date.now()),el=$('#tm');if(el){el.textContent=String(Math.floor(l/60000)).padStart(2,'0')+':'+String(Math.floor(l/1000)%60).padStart(2,'0');el.className='badge fs-6 bg-'+(l<60000?'danger':'dark')}if(l<=0){clearInterval(tm);submitQuiz(true)}}
function qRender(){
 const k=Q.qs[Q.i],last=Q.i===9;
 main(`<div class="card p-3 p-md-4"><div class="d-flex justify-content-between align-items-center mb-2"><h5 class="mb-0">${Q.topic}</h5><span id="tm" class="badge bg-dark fs-6">05:00</span></div>
${bar((Q.i+1)*10)}<div class="d-flex flex-wrap gap-1 my-3">${Q.qs.map((_,j)=>`<button class="btn dot btn-sm btn-${j===Q.i?'primary':Q.a[j]!==null?'success':'outline-secondary'}" onclick="Q.i=${j};qRender()">${j+1}</button>`).join('')}</div>
<h5 class="mb-3">Q${Q.i+1}. ${esc(k.t)}</h5>${k.o.map((o,j)=>`<button class="opt ${Q.a[Q.i]===j?'sel':''}" onclick="Q.a[Q.i]=${j};qRender()"><b>${'ABCD'[j]}.</b> ${esc(o)}</button>`).join('')}
<div class="d-flex justify-content-between mt-3"><button class="btn btn-outline-secondary" ${Q.i?'':'disabled'} onclick="Q.i--;qRender()"><i class="bi bi-arrow-left"></i> Previous</button>
${last?`<button class="btn btn-success" onclick="submitQuiz(false)"><i class="bi bi-send"></i> Submit</button>`:`<button class="btn btn-primary" onclick="Q.i++;qRender()">Next <i class="bi bi-arrow-right"></i></button>`}</div></div>`);tick()}
function submitQuiz(auto){
 const un=Q.a.filter(x=>x===null).length;
 if(!auto&&un&&!confirm(un+' question(s) unanswered. Submit anyway?'))return;
 clearInterval(tm);Q.done=true;
 const score=Q.qs.filter((k,i)=>Q.a[i]===k.a).length,pct=score*10;
 const at=atts();at.push({sid:me.id,name:me.name,topic:Q.topic,score,total:10,pct,pass:pct>=60,date:new Date().toLocaleString()});sv('pe_attempts',at);
 const k=Q.qs.map((x,i)=>Q.a[i]===x.a);
 main(`<div class="card p-4 text-center mb-3"><h3>${Q.topic} — Result</h3><div class="display-4 fw-bold text-${pct>=60?'success':'danger'}">${score}/10 · ${pct}%</div><div><span class="badge fs-5 bg-${pct>=60?'success':'danger'}">${pct>=60?'PASS':'FAIL'}</span>${auto?' <span class="badge bg-warning text-dark">Time up</span>':''}</div><div class="mt-3"><button class="btn btn-primary" onclick="go('quiz')">Back to quizzes</button></div></div>
<h5>Review (${k.filter(x=>!x).length} wrong)</h5>${Q.qs.map((x,i)=>`<div class="card mb-2 border-start border-4 border-${k[i]?'success':'danger'}"><div class="card-body py-2"><b>${i+1}. ${esc(x.t)}</b>
${k[i]?`<div class="text-success"><i class="bi bi-check-circle"></i> ${esc(x.o[x.a])}</div>`:`<div class="text-danger"><i class="bi bi-x-circle"></i> Your answer: ${Q.a[i]===null?'(not answered)':esc(x.o[Q.a[i]])}</div><div class="text-success"><i class="bi bi-check-circle"></i> Correct answer: ${esc(x.o[x.a])}</div><div class="small text-muted mt-1"><i class="bi bi-lightbulb"></i> ${esc(x.e)}</div>`}</div></div>`).join('')}`)}

/* ---------- Coding practice (Pyodide) ---------- */
async function getPy(){ // load Pyodide lazily from CDN, once
 if(!PY){await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js';s.onload=ok;s.onerror=()=>no(new Error('Could not load Pyodide (check internet connection)'));document.head.appendChild(s)});PY=await loadPyodide()}
 return PY}
async function runPy(code){ // run code in a fresh namespace and capture stdout/stderr
 const py=await getPy();let out='';py.setStdout({batched:s=>out+=s+'\n'});py.setStderr({batched:s=>out+=s+'\n'});
 const g=py.globals.get('dict')();
 try{await py.runPythonAsync(code,{globals:g});return{ok:true,out:out.trim()}}
 catch(e){return{ok:false,out:out.trim(),err:String(e.message).trim().split('\n').slice(-3).join('\n')}}
 finally{g.destroy()}}
V.practice=()=>codeView(false);V.adv=()=>codeView(true);
function codeView(adv){
 if(adv&&!advOpen()){return main(`<div class="card p-5 text-center"><i class="bi bi-lock display-3 text-secondary"></i><h4>Advanced Challenges are locked</h4><p class="text-muted">Complete topics 1-7 in Learn to unlock.</p><div><button class="btn btn-primary" onclick="go('learn')">Go to Learn</button></div></div>`)}
 const list=EX.filter(e=>!!e.adv===adv),p=gp();
 if(!CX.id||!list.find(e=>e.id===CX.id))CX.id=list[0].id;
 const e=list.find(x=>x.id===CX.id),done=list.filter(x=>p.code[x.id]).length;
 main(`<h3>${adv?'Advanced Challenges':'Coding Practice'}</h3><p class="text-muted">${done}/${list.length} completed</p>${bar(done/list.length*100,'info')}
<div class="row g-3 mt-1"><div class="col-lg-3"><div class="list-group">${list.map(x=>`<button class="list-group-item list-group-item-action d-flex justify-content-between ${x.id===e.id?'active':''}" onclick="CX.id='${x.id}';codeView(${adv})">${x.t}<i class="bi bi-${p.code[x.id]?'check-circle-fill':'circle'}"></i></button>`).join('')}</div></div>
<div class="col-lg-9"><div class="card p-3"><h5>${e.t} ${p.code[e.id]?'<span class="badge bg-success">Completed</span>':''}</h5><p>${e.d}</p>
<textarea id="ed" class="form-control mb-2" spellcheck="false" oninput="saveSrc()" onkeydown="if(event.key==='Tab'){event.preventDefault();document.execCommand('insertText',false,'    ')}">${esc(p.src[e.id]??e.s)}</textarea>
<div class="d-flex flex-wrap gap-2 mb-3"><button class="btn btn-primary" onclick="runCode()"><i class="bi bi-play-fill"></i> Run Code</button><button class="btn btn-warning" onclick="runTests(${adv})"><i class="bi bi-clipboard-check"></i> Run &amp; Test</button><button class="btn btn-outline-secondary" onclick="resetCode()"><i class="bi bi-arrow-counterclockwise"></i> Reset</button><button id="mk" class="btn btn-success ms-auto" ${passed[e.id]||p.code[e.id]?'':'disabled'} onclick="markDone(${adv})"><i class="bi bi-check2-all"></i> Mark Complete</button></div>
<h6>Output</h6><div id="out" class="outbox mb-3">Press Run Code to see output.</div><h6>Test cases</h6><div id="tests" class="table-responsive"><table class="table table-sm"><thead><tr><th>Test</th><th>Expected</th><th>Actual</th><th>Status</th></tr></thead><tbody>${e.T.map(t=>`<tr><td><code>${esc(t.c||'program output')}</code></td><td><code>${esc(t.e)}</code></td><td>—</td><td><span class="badge bg-secondary">Not run</span></td></tr>`).join('')}</tbody></table></div></div></div></div>`)}
const curEx=()=>EX.find(e=>e.id===CX.id);
function saveSrc(){const p=gp();p.src[CX.id]=$('#ed').value;sp(p)}
function resetCode(){const p=gp();delete p.src[CX.id];sp(p);passed[CX.id]=false;codeView(!!curEx().adv)}
async function runCode(){
 $('#out').textContent='⏳ Running (first run loads Python, please wait)…';
 try{const r=await runPy($('#ed').value);$('#out').innerHTML=esc(r.out||(r.ok?'(no output)':''))+(r.ok?'':`<div style="color:#ff7b7b">${esc(r.err)}</div>`)}
 catch(e){$('#out').innerHTML=`<span style="color:#ff7b7b">${esc(e.message)}</span>`}}
async function runTests(adv){
 const e=curEx(),code=$('#ed').value;let ok=0,rows='';
 $('#out').textContent='⏳ Testing…';
 try{for(const t of e.T){ // each test = user code + a call line, run fresh
  const r=await runPy(code+'\n'+t.c),act=r.ok?r.out:'Error: '+r.err,pass=r.ok&&r.out===t.e;if(pass)ok++;
  rows+=`<tr><td><code>${esc(t.c||'program output')}</code></td><td><code>${esc(t.e)}</code></td><td><code>${esc(act)}</code></td><td><span class="badge bg-${pass?'success':'danger'}">${pass?'Pass':'Fail'}</span></td></tr>`}}
 catch(err){return $('#out').innerHTML=`<span style="color:#ff7b7b">${esc(err.message)}</span>`}
 passed[e.id]=ok===e.T.length;
 $('#tests').innerHTML=`<table class="table table-sm"><thead><tr><th>Test</th><th>Expected</th><th>Actual</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
 $('#out').innerHTML=passed[e.id]?'✅ All tests passed! You can mark this complete.':`❌ ${ok}/${e.T.length} tests passed.`;
 $('#mk').disabled=!passed[e.id]&&!gp().code[e.id]}
function markDone(adv){ // only possible after all tests passed
 const e=curEx();if(!passed[e.id]&&!gp().code[e.id])return;
 const p=gp();p.code[e.id]=true;if(EX.filter(x=>x.adv).every(x=>p.code[x.id]))p.topics.adv=true;sp(p);codeView(adv)}

/* ================= BOOT ================= */
if(me){shell();go('dash')}else authView();
</script></body></html>
